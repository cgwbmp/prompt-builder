name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same gate as the deploy workflow: lint, catalog check, format, typecheck, build.
      - run: npm run build
      # Unit tests, gated on the 80% coverage thresholds in vitest.config.ts.
      - run: npm run test:coverage
